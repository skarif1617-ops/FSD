<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Calculator App</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Poppins",Arial,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#667eea,#764ba2);
}



.calculator{

    width:360px;
    padding:25px;
    background:#20202d;
    border-radius:30px;
    box-shadow:
    0 20px 50px rgba(0,0,0,0.5);

}



h2{

    color:white;
    text-align:center;
    margin-bottom:20px;
    letter-spacing:2px;

}




#display{

    width:100%;
    height:80px;

    background:#000;

    color:#00ff88;

    font-size:38px;

    text-align:right;

    padding:20px;

    border-radius:15px;

    margin-bottom:25px;

    overflow:hidden;

}





.buttons{

    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:15px;

}



button{

    height:60px;

    border:none;

    border-radius:18px;

    font-size:22px;

    color:white;

    background:#35354d;

    cursor:pointer;

    transition:.3s;

}



button:hover{

    transform:scale(1.08);

    background:#48486b;

}



.operator{

    background:#ff9500;

}


.operator:hover{

    background:#e07d00;

}





.clear{

    background:#ff3b30;

}


.clear:hover{

    background:#d52d27;

}





.equal{

    background:#00a86b;

   

}


.equal:hover{

    background:#008f5b;

}



</style>

</head>


<body>


<div class="calculator">


<h2>CALCULATOR</h2>


<div id="display">
0
</div>



<div class="buttons">


<button class="clear" onclick="clearDisplay()">C</button>

<button onclick="deleteNumber()">⌫</button>

<button class="operator" onclick="press('%')">%</button>

<button class="operator" onclick="press('/')">÷</button>



<button onclick="press('7')">7</button>

<button onclick="press('8')">8</button>

<button onclick="press('9')">9</button>

<button class="operator" onclick="press('*')">×</button>



<button onclick="press('4')">4</button>

<button onclick="press('5')">5</button>

<button onclick="press('6')">6</button>

<button class="operator" onclick="press('-')">−</button>



<button onclick="press('1')">1</button>

<button onclick="press('2')">2</button>

<button onclick="press('3')">3</button>

<button class="operator" onclick="press('+')">+</button>



<button onclick="press('00')">00</button>

<button onclick="press('0')">0</button>

<button onclick="press('.')">.</button>

<button class="equal" onclick="result()">=</button>



</div>


</div>





<script>


let display=document.getElementById("display");



function press(value){

    if(display.innerHTML=="0"){

        display.innerHTML=value;

    }

    else{

        display.innerHTML+=value;

    }

}




function clearDisplay(){

    display.innerHTML="0";

}




function deleteNumber(){

    let value=display.innerHTML;

    value=value.slice(0,-1);


    if(value==""){

        display.innerHTML="0";

    }

    else{

        display.innerHTML=value;

    }

}





function result(){

    try{

        display.innerHTML=eval(display.innerHTML);

    }

    catch{

        display.innerHTML="Error";

    }

}



</script>



</body>
</html>
