<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Important React JS Concepts</title>

  <!-- React CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 25px;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      text-align: center;
      color: #222;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      padding: 25px;
      margin-bottom: 25px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .card h2 {
      color: #2563eb;
      margin-top: 0;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      background: #1d4ed8;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      margin: 10px 0 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .message-box {
      border: 1px solid #ccc;
      padding: 15px;
      border-radius: 8px;
      background: #f9fafb;
    }

    ul {
      padding-left: 20px;
    }

    .name-list {
      list-style: none;
      padding: 0;
    }

    .name-item {
      padding: 10px;
      margin-bottom: 5px;
      border: 1px solid #aaa;
      border-radius: 5px;
      cursor: pointer;
      background: white;
    }

    .name-item:hover {
      background: #eef6ff;
    }

    .selected {
      background: #dbeafe !important;
      border-color: #2563eb;
    }

    .post {
      border-bottom: 1px solid #ddd;
      padding: 10px 0;
    }

    .post:last-child {
      border-bottom: none;
    }

    .success {
      color: green;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div id="root"></div>

<script type="text/babel">

  const { useState, useEffect } = React;


  /* =====================================================
     1. useState HOOK - COUNTER
     ===================================================== */

  function Counter() {

    const [count, setCount] = useState(0);

    return (
      <div className="card">
        <h2>1. Counter using useState</h2>

        <p>
          Counter: <strong>{count}</strong>
        </p>

        <button onClick={() => setCount(count + 1)}>
          Increase
        </button>
      </div>
    );
  }


  /* =====================================================
     2. useEffect HOOK - API DATA FETCHING
     ===================================================== */

  function DataFetcher() {

    const [posts, setPosts] = useState([]);
    const [loading, setLoading] = useState(true);
    const [error, setError] = useState(null);

    useEffect(() => {

      fetch("https://jsonplaceholder.typicode.com/posts")

        .then((response) => {

          if (!response.ok) {
            throw new Error("Failed to fetch data");
          }

          return response.json();
        })

        .then((data) => {

          setPosts(data);
          setLoading(false);

        })

        .catch((err) => {

          setError(err.message);
          setLoading(false);

        });

    }, []);

    if (loading) {
      return (
        <div className="card">
          <h2>2. API Fetching using useEffect</h2>
          <p>Loading...</p>
        </div>
      );
    }

    if (error) {
      return (
        <div className="card">
          <h2>2. API Fetching using useEffect</h2>
          <p style={{color: "red"}}>Error: {error}</p>
        </div>
      );
    }

    return (
      <div className="card">

        <h2>2. API Fetching using useEffect</h2>

        <p>
          First 10 posts fetched from the API:
        </p>

        <ul>

          {posts.slice(0, 10).map((post) => (

            <li className="post" key={post.id}>

              <strong>{post.title}</strong>

              <p>{post.body}</p>

            </li>

          ))}

        </ul>

      </div>
    );
  }


  /* =====================================================
     3. PROPS - PARENT TO CHILD
     ===================================================== */

  function MessageDisplay({ message }) {

    return (

      <div className="message-box">

        <h3>Message from Parent</h3>

        <p>{message}</p>

      </div>

    );
  }


  function ParentComponent() {

    const [message] = useState(
      "Hello from the parent component!"
    );

    return (

      <div className="card">

        <h2>3. React Props</h2>

        <MessageDisplay message={message} />

      </div>

    );
  }


  /* =====================================================
     4. FORM HANDLING
     ===================================================== */

  function SimpleForm() {

    const [name, setName] = useState("");
    const [submitted, setSubmitted] = useState(false);

    const handleChange = (event) => {

      setName(event.target.value);

      // Reset message if user changes the name
      setSubmitted(false);

    };

    const handleSubmit = (event) => {

      event.preventDefault();

      setSubmitted(true);

    };

    return (

      <div className="card">

        <h2>4. Forms in React</h2>

        {!submitted ? (

          <form onSubmit={handleSubmit}>

            <label>
              Your Name:
            </label>

            <input
              type="text"
              value={name}
              onChange={handleChange}
              placeholder="Enter your name"
              required
            />

            <button type="submit">
              Submit
            </button>

          </form>

        ) : (

          <p className="success">
            Hello, {name}! Your form has been submitted.
          </p>

        )}

      </div>

    );
  }


  /* =====================================================
     5. ITERATIVE RENDERING USING map()
     ===================================================== */

  function NameList() {

    const names = [
      "Apple",
      "Banana",
      "Cherry",
      "Mango"
    ];

    const [selectedName, setSelectedName] = useState(null);

    const handleClick = (name) => {

      setSelectedName(name);

    };

    return (

      <div className="card">

        <h2>5. Iterative Rendering using map()</h2>

        <ul className="name-list">

          {names.map((name, index) => (

            <li
              key={index}
              className={
                "name-item " +
                (name === selectedName ? "selected" : "")
              }
              onClick={() => handleClick(name)}
            >

              {name}

            </li>

          ))}

        </ul>

        {selectedName && (

          <p>
            You clicked on:
            <strong> {selectedName}</strong>
          </p>

        )}

      </div>

    );
  }


  /* =====================================================
     MAIN APP COMPONENT
     ===================================================== */

  function App() {

    return (

      <div className="container">

        <h1>
          Important Concepts of React JS
        </h1>

        <Counter />

        <DataFetcher />

        <ParentComponent />

        <SimpleForm />

        <NameList />

      </div>

    );
  }


  /* =====================================================
     RENDER APP
     ===================================================== */

  const root = ReactDOM.createRoot(
    document.getElementById("root")
  );

  root.render(<App />);

</script>

</body>
</html>
